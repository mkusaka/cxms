name: CodSpeed Performance Monitoring
on:
  push:
    branches: [main, codespeed]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/codspeed.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/codspeed.yml'
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  benchmarks:
    name: Run CodSpeed Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-codspeed
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-codspeed
      - name: Build benchmarks
        run: cargo codspeed build
      - name: Run benchmarks
        id: codspeed
        continue-on-error: true
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          run: cargo codspeed run
          token: ${{ secrets.CODSPEED_TOKEN }}
      - name: Report CodSpeed upload failure
        if: ${{ steps.codspeed.outcome == 'failure' }}
        run: |
          echo "CodSpeed benchmarks completed but upload failed." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow is non-blocking until CODSPEED_TOKEN access is fixed." >> "$GITHUB_STEP_SUMMARY"
    permissions: {}
    timeout-minutes: 60
    environment: codspeed
permissions: {}
